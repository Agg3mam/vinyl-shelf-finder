name: Byg og checks

# Bygger appen og kører selvtesten på en Mac hos GitHub, så ændringer kan tjekkes
# uden brugerens egen Mac. Rører aldrig nøglering, Discogs eller rigtige data.
on:
  push:
    branches-ignore: [design-retning-*, ci-snapshots, claude/udgivelse-*]
  workflow_dispatch:

# contents: write er kun til at lægge snapshots på grenen ci-snapshots (se sidste trin).
permissions:
  contents: write

jobs:
  checks:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Design-billederne (ca. 350 MB) skal ikke bruges til at bygge.
          sparse-checkout: |
            Sources
            Resources
            ios
            web
      - name: Vis værktøjer
        run: |
          sw_vers
          xcrun swift --version
      - name: Byg
        run: swift build
      - name: Checks
        run: swift run VinylCoreChecks
      # Webappen (web/) skal søge og finde præcis som Swift: facit fra Swift, sammenlignet i JavaScriptCore.
      - name: Webappens checks
        run: web/checks/run.sh
      # iPhone-appen (ios/) bygges til simulatoren, så kernen også altid kan bruges på iPhone.
      - name: Byg iPhone-appen
        run: |
          xcodebuild -project ios/VinylShelfiOS.xcodeproj -scheme VinylShelfiOS \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/ios \
            CODE_SIGNING_ALLOWED=NO build | tail -20
          test "${PIPESTATUS[0]}" -eq 0
      # Billeder af demo-appens skærme (offscreen, ingen rigtige data), så designet kan ses uden en Mac.
      - name: Snapshots (demo)
        continue-on-error: true
        run: |
          H=$(mktemp -d)
          mkdir -p snapshots
          CFFIXED_USER_HOME=$H .build/debug/VinylShelfFinder --demo --snapshot "$PWD/snapshots" &
          p=$!
          for i in $(seq 1 150); do kill -0 $p 2>/dev/null || break; sleep 1; done
          kill $p 2>/dev/null || true
          ls -la snapshots
      - name: Gem snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: warn
          retention-days: 7
      # Billederne lægges også på grenen ci-snapshots (overskrives hver gang), så de kan
      # hentes med git, hvor artefakter ikke kan hentes (fx fra en cloud-session).
      - name: Læg snapshots på grenen ci-snapshots
        if: always()
        continue-on-error: true
        run: |
          [ -d snapshots ] && [ -n "$(ls snapshots)" ] || exit 0
          cd snapshots
          git init -q -b ci-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshots fra ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-snapshots
